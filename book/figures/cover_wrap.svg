<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 918 666" width="12.7544in" height="9.2500in">
<defs><linearGradient id="wrapbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2EEE4"/><stop offset="1" stop-color="#E9E3D6"/></linearGradient></defs>
<rect x="0" y="0" width="918" height="666" fill="url(#wrapbg)"/>
<g transform="translate(34.20,37.80)">
<text font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="21" fill="#141414">LET US BREW AN AI MODEL</text>
<text y="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="13" fill="#6E6E68">What tiny language models can actually learn when given one job</text>
<rect x="0" y="44" width="381.60" height="2" fill="#1E7A6F"/>
<text font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="13.5" fill="#3B3B38">
<tspan x="0" y="90">Building a small language model is comparatively easy.</tspan>
<tspan x="0" y="110">Determining what it actually learned is the hard part.</tspan>
<tspan x="0" y="138">This book is a controlled empirical investigation into one</tspan>
<tspan x="0" y="158">tiny transformer, given exactly one job: read a plain-English</tspan>
<tspan x="0" y="178">programming request, write Python, and pass hidden tests. We</tspan>
<tspan x="0" y="198">measure where its capability ends.</tspan>
</text>
<rect x="0" y="250" width="381.60" height="169" rx="8" fill="#FFFFFF" stroke="#1E7A6F" stroke-width="2"/>
<text x="14" y="280" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="16" fill="#1E7A6F">THE CAPABILITY MAP</text>
<text x="14" y="310" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="13" fill="#3B3B38"><tspan font-weight="700" fill="#A84C1F">L1</tspan>  Memorize - generalizes <tspan fill="#3B3B38">| 59/60 held-out</tspan></text>
<text x="14" y="332" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="13" fill="#3B3B38"><tspan font-weight="700" fill="#A84C1F">L2</tspan>  New instances <tspan fill="#3B3B38">| 0.900</tspan></text>
<text x="14" y="354" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="13" fill="#3B3B38"><tspan font-weight="700" fill="#A84C1F">L3</tspan>  Surface change <tspan fill="#3B3B38">| 0.000</tspan></text>
<text x="14" y="376" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="13" fill="#3B3B38"><tspan font-weight="700" fill="#A84C1F">L4</tspan>  Composition <tspan fill="#3B3B38">| 0.000</tspan></text>
<text x="14" y="389" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="11.5" fill="#6E6E68">Including the Failure Ledger on the broken evaluator, the leaked</text>
<text x="14" y="408" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="11.5" fill="#6E6E68">wording, and a task a lookup table solved.</text>
<text x="0" y="601.20" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="22" fill="#141414">ZHIQI TAO</text>
</g>
